spring:
  application:
    name: material-studio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/material_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:material}
    password: ${SPRING_DATASOURCE_PASSWORD:material_dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  session:
    secret: ${APP_SESSION_SECRET:local-development-secret-change-me-123456}
    secure-cookie: ${APP_SESSION_SECURE:false}
  storage:
    root: ${APP_STORAGE_ROOT:./data}
    max-pixels: 40000000
  worker:
    threads: 4
    queue-capacity: 100
  simulation:
    default-delay-ms: 1200
    default-fail-stage: ""
